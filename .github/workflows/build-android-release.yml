name: Build signed KONNEKT Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Install dependencies and build web assets
        run: |
          npm install
          npm run build:mobile
      - name: Generate Android project
        run: npx cap add android
      - name: Install KONNEKT Android icon and splash assets
        run: |
          mkdir -p android/app/src/main/res
          cp -R android-res/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/drawable-nodpi android/app/src/main/res/values
          cp android-res/drawable/splash.png android/app/src/main/res/drawable/splash.png
          cp android-res/drawable-nodpi/splash.png android/app/src/main/res/drawable-nodpi/splash.png
          cp android-res/values/colors.xml android/app/src/main/res/values/colors.xml
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/konnekt-release.keystore"
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/konnekt-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: KONNEKT-Signed-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
