<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6a0dad"><title>KONNEKT Moderation</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial;background:#090511;color:#fff}body{margin:0;padding:24px;background:radial-gradient(ellipse at top left,#40106c,transparent 40%),#090511}main{max-width:900px;margin:auto}.panel{background:#180f25;border:1px solid #553174;border-radius:16px;padding:18px;margin:14px 0}.field,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #67418a;background:#10091a;color:#fff}input{display:block;width:100%;box-sizing:border-box;margin:8px 0}button{cursor:pointer;background:linear-gradient(100deg,#6a0dad,#ffc107);border:0;font-weight:700;margin:4px}.muted{color:#b9a9c9;font-size:13px}.report{border-top:1px solid #49305d;padding:14px 0}.status{color:#ffc107}a{color:#e7baff}
</style></head><body><main><h1>🛡️ KONNEKT Moderation</h1><p class="muted">Restricted staging tool. Sign in with a verified account whose Supabase app_metadata role is moderator.</p><section class="panel"><label>Email</label><input id="email" class="field" type="email" autocomplete="username"><label>Password</label><input id="password" class="field" type="password" autocomplete="current-password"><button onclick="signIn()">Moderator sign in</button><button onclick="loadReports()">Refresh reports</button><button onclick="signOut()">Sign out</button><p id="status" class="muted">Not signed in.</p></section><section class="panel"><h2>Report queue</h2><div id="reports" class="muted">Sign in to load the queue.</div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb;function status(t){document.getElementById('status').textContent=t}function init(){const c=window.KONNEKT_CONFIG||{};if(!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY){status('Set Supabase staging URL and public key in config.js');return}sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}})}
async function signIn(){try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;if(data.user.app_metadata?.role!=='moderator')throw new Error('This account is not assigned the moderator role.');status('Signed in as moderator.');await loadReports()}catch(e){status(e.message)}}
async function signOut(){if(sb)await sb.auth.signOut();document.getElementById('reports').textContent='Signed out.';status('Signed out.')}
async function loadReports(){try{const {data,error}=await sb.functions.invoke('moderation-inbox',{body:{}});if(error)throw error;const rows=data.reports||[];document.getElementById('reports').innerHTML=rows.map(r=>`<article class="report"><b>${esc(r.reason)}</b> <span class="status">${esc(r.status)}</span><p>${esc(r.details||'No extra details')}</p><small class="muted">Report ${esc(r.id)} · ${esc(new Date(r.created_at).toLocaleString())}</small><div><button onclick="review('${r.id}','reviewing')">Mark reviewing</button><button onclick="review('${r.id}','actioned')">Mark actioned</button><button onclick="review('${r.id}','dismissed')">Dismiss</button></div></article>`).join('')||'No reports.';status('Loaded '+rows.length+' reports.')}catch(e){status('Could not load reports: '+e.message)}}
async function review(id,state){const notes=prompt('Moderator notes (optional):')||'';try{const {data,error}=await sb.functions.invoke('moderation-review',{body:{report_id:id,status:state,notes}});if(error)throw error;await loadReports()}catch(e){status('Review failed: '+e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
