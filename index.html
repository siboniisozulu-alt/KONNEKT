<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="brand-k">K</span><span class="brand-word">KONNE<span>KT</span></span><small>CHAT · WATCH · CREATE · CONNECT</small></div>
  <div class="me"><div class="avatar">YO</div><div><b>Your Name</b><small>@yourusername</small></div></div>
  <nav class="nav" id="sideNav">
    <button data-page="Reels" class="active"><span class="ico">▶</span> Reels</button>
    <button data-page="Chats"><span class="ico">▤</span> Chats <span style="margin-left:auto;color:var(--green);font-size:11px">3</span></button>
    <button data-page="Calls"><span class="ico">☎</span> Calls</button>
    <button data-page="Status"><span class="ico">◉</span> Status</button>
    <button data-page="Discover"><span class="ico">⌕</span> Discover</button>
    <button data-page="Profile"><span class="ico">☻</span> Profile</button>
  </nav>
  <div class="sidebar-note"><strong>DESIGN PREVIEW</strong><br>This is an editable front-end prototype. Try the navigation, search, profile editor, chat composer and reel controls.</div>
</aside>
<main class="main">
  <header class="topbar"><div class="top-title" id="pageTitle">Reels</div><div class="top-right"><input class="search" id="globalSearch" placeholder="Search people, chats..."><button class="iconbtn" id="newAction" title="Create">＋</button><button class="iconbtn" id="installApp" title="Install KONNEKT">⇩</button><button class="iconbtn" id="accountAccess" title="Account & backend">♙</button><button class="iconbtn" id="settings" title="Settings">⚙</button></div></header>
  <section class="content" id="content"></section>
</main>
</div>
<nav class="mobile-nav" id="mobileNav">
<button data-page="Reels" class="active"><span class="ico">▶</span>Reels</button><button data-page="Chats"><span class="ico">▤</span>Chats</button><button data-page="Calls"><span class="ico">☎</span>Calls</button><button data-page="Status"><span class="ico">◉</span>Status</button><button data-page="Discover"><span class="ico">⌕</span>Discover</button><button data-page="Profile"><span class="ico">☻</span>Profile</button>
</nav>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), content=$('#content');let page='Reels';let liked=false,following=false;
const people=[{i:'AM',n:'Amanda M.',msg:'Hey! Are we still meeting later?',time:'09:42',count:2},{i:'JK',n:'Jason K.',msg:'That video was hilarious 😂',time:'09:18',count:1},{i:'LM',n:'Lerato M.',msg:'Sent you a photo',time:'Yesterday',count:0},{i:'TS',n:'Thabo S.',msg:'See you tomorrow!',time:'Yesterday',count:0},{i:'ZN',n:'Zanele N.',msg:'Thank you so much 💚',time:'Monday',count:0},{i:'PK',n:'Peter K.',msg:'Voice message',time:'Monday',count:0}];
function toast(t){let el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',2200)}
function head(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function avatar(i){return `<div class="avatar">${i}</div>`}
function setPage(p){page=p;$('#pageTitle').textContent=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
function render(){
 if(page==='Reels')content.innerHTML=reels();
 if(page==='Chats')content.innerHTML=chats($('#globalSearch').value);
 if(page==='Calls')content.innerHTML=calls();
 if(page==='Status')content.innerHTML=status();
 if(page==='Discover')content.innerHTML=discover();
 if(page==='Profile')content.innerHTML=profile();
}
function reels(){return `${head('Reels','Short videos, trends and creators — your world in motion.','<button class="btn" onclick="openCreateReel()">＋ Create Reel</button>')}
<div class="reel-layout"><div><div class="reel"><div class="reel-art"><div class="play">▶</div><h2>Welcome to KONNEKT</h2><p>Discover your next favourite moment.</p><span class="tag">FEATURED PREVIEW</span></div><div class="reel-bottom"><b>@konnekt.community <span class="tag">Following</span></b><p>Every connection starts with a moment. 💚 #KONNEKT #ForYou</p><small>♫ Original audio · KONNEKT</small></div><div class="reel-actions"><button onclick="toggleLike(this)">${liked?'♥':'♡'}<span>${liked?'1.3K':'1.2K'}</span></button><button onclick="toast('Comments panel preview')">▢<span>248</span></button><button onclick="toast('Share options coming in the next build')">↗<span>Share</span></button><button onclick="toast('Saved to your favourites')">▣<span>Save</span></button><button onclick="toast('More video options')">⋯<span>More</span></button></div></div><div class="video-tools"><button class="btn secondary" onclick="toast('Video feed: For You selected')">For You</button><button class="btn ghost" onclick="toast('Following feed selected')">Following</button><button class="btn ghost" onclick="toast('Friends feed selected')">Friends</button><button class="btn ghost" onclick="toast('LIVE preview coming soon')">LIVE</button></div></div>
<aside class="reel-side"><div class="card"><span class="tag">YOUR VIDEO TOOLKIT</span><h3 style="margin:10px 0 5px">Create like a pro</h3><p class="muted small">The full Reels experience is planned around the tools creators expect.</p><div class="divider"></div><div class="small">🎬 Record or upload video</div><div class="small" style="margin-top:10px">🎵 Sounds and music library</div><div class="small" style="margin-top:10px">✂️ Trim, speed and effects</div><div class="small" style="margin-top:10px">✨ Filters, text and stickers</div><div class="small" style="margin-top:10px">#️⃣ Captions, hashtags and mentions</div><button class="btn" style="width:100%;margin-top:15px" onclick="openCreateReel()">Create a Reel</button></div><div class="card"><b>Trending on KONNEKT</b><p class="muted small">#GoodVibes　#DanceChallenge　#MyDay　#Mzansi</p><div class="divider"></div><b>Suggested creators</b><div class="person" style="margin-top:10px">${avatar('NM')}<div class="person-info"><b>Naledi Creates</b><small>Creator · 12.4K followers</small></div><button class="btn secondary" onclick="toast('Following Naledi')">Follow</button></div></div></aside></div>`}
function chats(filter=''){let rows=people.filter(p=>(p.n+p.msg).toLowerCase().includes(filter.toLowerCase()));return `${head('Chats','Private conversations with your people.','<button class="btn" onclick="openChat()">＋ New chat</button>')}<div class="stories"><div class="story add"><div class="story-ring"><div class="avatar">＋</div></div>My status</div>${people.slice(0,5).map(p=>`<div class="story"><div class="story-ring"><div class="avatar">${p.i}</div></div>${p.n.split(' ')[0]}</div>`).join('')}</div><div class="card">${rows.map(p=>`<div class="chatrow" onclick="openConversation('${p.n}')">${avatar(p.i)}<div class="chatbody"><b>${p.n}</b><p>${p.msg}</p></div><div class="chatmeta">${p.time}${p.count?`<br><span class="unread">${p.count}</span>`:''}</div></div>`).join('')||'<p class="muted">No matching chats.</p>'}</div>`}
function calls(){return `${head('Calls','Voice and video calls, all in one place.','<button class="btn" onclick="toast(\'Start a call: choose a contact\')">＋ New call</button>')}<div class="grid two"><div class="card"><span class="tag">QUICK CONNECT</span><h3>Make a call</h3><p class="muted small">Start a voice or video conversation with someone you know.</p><div class="quick"><button class="btn" onclick="toast('Choose a contact for a voice call')">☎ Voice call</button><button class="btn secondary" onclick="toast('Choose a contact for a video call')">▣ Video call</button></div></div><div class="card"><h3>Call links</h3><p class="muted small">Create a link and invite people to join a call.</p><button class="btn ghost" onclick="toast('Call link copied (preview)')">＋ Create call link</button></div></div><h3 style="margin:25px 0 12px">Recent</h3><div class="call-list">${people.slice(0,5).map((p,i)=>`<div class="person">${avatar(p.i)}<div class="person-info"><b>${p.n}</b><small>${i%2?'↙ Incoming voice call':'↗ Outgoing video call'} · ${p.time}</small></div><button class="iconbtn" onclick="toast('Calling ${p.n}')">☎</button><button class="iconbtn" onclick="toast('Video calling ${p.n}')">▣</button></div>`).join('')}</div>`}
function status(){return `${head('Status','Share a photo, video or thought that disappears after 24 hours.','<button class="btn" onclick="openStatus()">＋ Add status</button>')}<div class="card"><div class="person">${avatar('YO')}<div class="person-info"><b>My status</b><small>Share an update with your contacts</small></div><button class="btn secondary" onclick="openStatus()">Add</button></div></div><h3 style="margin:25px 0 12px">Recent updates</h3><div class="status-list">${people.slice(0,5).map(p=>`<div class="person" onclick="toast('Opening ${p.n}\\'s status')"><div class="story-ring" style="margin:0"><div class="avatar">${p.i}</div></div><div class="person-info"><b>${p.n}</b><small>Today · ${p.time}</small></div><span class="muted">›</span></div>`).join('')}</div>`}
function discover(){return `${head('Discover','Find creators, communities, people and new things to follow.','<button class="btn" onclick="toast(\'Explore categories\')">Explore all</button>')}<div class="card" style="margin-bottom:16px"><span class="tag">SEARCH KONNEKT</span><input class="field" style="margin-top:10px" placeholder="Search creators, topics, communities..." onkeydown="if(event.key==='Enter')toast('Searching: '+this.value)"></div><div class="grid discover-grid"><div class="discover-card"><span class="emoji">🔥</span><div><b>Trending Reels</b><p>See what's popular right now.</p></div></div><div class="discover-card"><span class="emoji">🎨</span><div><b>Creators</b><p>Meet fresh voices and talent.</p></div></div><div class="discover-card"><span class="emoji">🌍</span><div><b>Communities</b><p>Find your people and interests.</p></div></div><div class="discover-card"><span class="emoji">🎧</span><div><b>Sounds</b><p>Explore popular audio.</p></div></div><div class="discover-card"><span class="emoji">✨</span><div><b>For You</b><p>Discover something new.</p></div></div><div class="discover-card"><span class="emoji">📍</span><div><b>Local picks</b><p>What's happening around you.</p></div></div></div><h3 style="margin:25px 0 12px">People you may know</h3><div class="grid two">${['Naledi Creates','Sihle M.','The Vibe Crew','Lwazi D.'].map((n,i)=>`<div class="person">${avatar(['NC','SM','VC','LD'][i])}<div class="person-info"><b>${n}</b><small>Suggested for you</small></div><button class="btn secondary" onclick="toast('Follow request sent')">Follow</button></div>`).join('')}</div>`}
function profile(){return `${head('Profile','Your identity and your corner of KONNEKT.','<button class="btn" onclick="openProfile()">✎ Edit profile</button>')}<div class="card" style="padding:0 0 18px;overflow:hidden"><div class="profile-cover"></div><div class="profile-head">${avatar('YO')}<div style="padding-bottom:7px"><h2 style="margin:0;font-size:20px">Your Name</h2><span class="muted small">@yourusername</span></div></div><p class="muted small" style="margin:0 20px">Making connections that matter. 💚</p><div class="stats"><div><strong>12</strong><span>Posts</span></div><div><strong>248</strong><span>Followers</span></div><div><strong>180</strong><span>Following</span></div></div><div class="divider" style="margin:0 20px 15px"></div><div style="padding:0 20px"><b>About</b><p class="muted small">Your bio will appear here. Tell people a little about yourself.</p><div class="quick"><button class="btn secondary" onclick="openProfile()">Edit profile</button><button class="btn ghost" onclick="toast('Settings panel coming soon')">⚙ Settings</button><button class="btn ghost" onclick="toast('Privacy settings coming soon')">🔒 Privacy</button></div></div></div><h3 style="margin:22px 0 10px">Your posts</h3><div class="card muted small">Your Reels and posts will appear here.</div>`}
function modal(title,body,save){$('#modalbox').innerHTML=`<h2>${title}</h2><p class="muted small">Preview interaction — no account or backend required.</p>${body}<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="${save}">Save</button></div>`;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function openProfile(){modal('Edit profile',`<label>Display name</label><input id="editName" class="field" value="Your Name"><label>Username</label><input id="editUser" class="field" value="@yourusername"><label>Bio</label><textarea id="editBio" class="field" rows="3">Making connections that matter. 💚</textarea>`,"saveProfile()")}
function saveProfile(){let n=$('#editName').value;let u=$('#editUser').value;document.querySelector('.profile-head h2').textContent=n;document.querySelector('.profile-head .muted').textContent=u;closeModal();toast('Profile preview updated')}
function openStatus(){modal('Create a status',`<label>What's on your mind?</label><textarea id="statusText" class="field" rows="4" placeholder="Share a moment..."></textarea><label>Media (preview)</label><input class="field" type="file" accept="image/*,video/*">`,"saveStatus()")}
function saveStatus(){let t=$('#statusText').value||'New status update';closeModal();toast('Status added: '+t)}
function openCreateReel(){modal('Create a Reel',`<label>Choose a video</label><input class="field" type="file" accept="video/*"><label>Caption</label><textarea class="field" id="reelCaption" rows="3" placeholder="Write a caption..."></textarea><label>Hashtags</label><input class="field" placeholder="#KONNEKT #ForYou"><p class="muted small">The full creator tools (music, effects, editing, filters and publishing) will be added in a later build.</p>`,"saveReel()")}
function saveReel(){let t=$('#reelCaption').value;closeModal();toast('Reel draft saved'+(t?': '+t:''))}
function openChat(){modal('Start a new chat',`<label>Contact name or number</label><input id="contact" class="field" placeholder="Enter a name or number"><label>Message</label><textarea id="firstMsg" class="field" rows="3" placeholder="Write your first message..."></textarea>`,"saveChat()")}
function saveChat(){let n=$('#contact').value||'New contact';closeModal();toast('Chat preview created for '+n)}
function openConversation(n){modal(n,`<div class="card"><p class="small">This is a sample conversation.</p><p style="background:#203b2a;padding:11px;border-radius:12px">Hey! Welcome to KONNEKT 👋</p><p style="background:#24302a;padding:11px;border-radius:12px">Thanks! Great to connect 💚</p></div><label>Message</label><input id="reply" class="field" placeholder="Type a message...">`,"sendReply()")}
function sendReply(){let v=$('#reply').value;closeModal();toast(v?'Message preview: '+v:'No message entered')}
function toggleLike(btn){liked=!liked;btn.innerHTML=(liked?'♥':'♡')+`<span>${liked?'1.3K':'1.2K'}</span>`;toast(liked?'Added to liked Reels':'Like removed')}
$('#sideNav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
$('#mobileNav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
$('#globalSearch').addEventListener('input',e=>{if(page==='Chats')render()});
$('#newAction').onclick=()=>page==='Reels'?openCreateReel():page==='Chats'?openChat():page==='Status'?openStatus():toast('Create something on '+page);
$('#settings').onclick=()=>toast('Settings preview coming soon');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
</script>

<script>/* KONNEKT local-first interaction layer. Data stays on this device; no backend is connected. */
const K_STORE='konnekt-local-v3';
const K_DEFAULT={profile:{name:'Your Name',username:'@yourusername',bio:'Making connections that matter. 💚'},chats:[
 {id:'amanda',name:'Amanda M.',initials:'AM',messages:[{from:'them',text:'Hey! Are we still meeting later?',time:'09:42'},{from:'me',text:'Yes! See you soon 💚',time:'09:45'}]},
 {id:'jason',name:'Jason K.',initials:'JK',messages:[{from:'them',text:'That video was hilarious 😂',time:'09:18'}]},
 {id:'lerato',name:'Lerato M.',initials:'LM',messages:[{from:'them',text:'Sent you a photo',time:'Yesterday'}]},
 {id:'thabo',name:'Thabo S.',initials:'TS',messages:[{from:'them',text:'See you tomorrow!',time:'Yesterday'}]},
 {id:'zanele',name:'Zanele N.',initials:'ZN',messages:[{from:'them',text:'Thank you so much 💚',time:'Monday'}]},
 {id:'peter',name:'Peter K.',initials:'PK',messages:[{from:'them',text:'Voice message',time:'Monday'}]}],statuses:[],reels:[],calls:[],following:[],saved:[],liked:[],feed:'For You'};
let K_data=(()=>{try{return {...K_DEFAULT,...JSON.parse(localStorage.getItem(K_STORE)||'{}')}}catch(e){return JSON.parse(JSON.stringify(K_DEFAULT))}})();
let K_openChatId=null;
function K_save(){try{localStorage.setItem(K_STORE,JSON.stringify(K_data))}catch(e){toast('Device storage is full. Remove large media and try again.')}}
function K_esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function K_time(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function K_id(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function K_chat(id){return K_data.chats.find(c=>c.id===id)}
function K_modal(title,body,saveLabel='Done',saveAction='closeModal()'){ $('#modalbox').innerHTML=`<h2>${K_esc(title)}</h2><p class="muted small">Saved on this device for preview testing. Not sent to other users.</p>${body}<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="${saveAction}">${saveLabel}</button></div>`;$('#modal').classList.add('show') }
function render(){if(page==='Reels')content.innerHTML=reels();if(page==='Chats')content.innerHTML=chats($('#globalSearch').value);if(page==='Calls')content.innerHTML=calls();if(page==='Status')content.innerHTML=status();if(page==='Discover')content.innerHTML=discover();if(page==='Profile')content.innerHTML=profile()}
function chats(filter=''){let rows=K_data.chats.filter(c=>(c.name+' '+(c.messages.at(-1)?.text||'')).toLowerCase().includes(filter.toLowerCase()));return `${head('Chats','Your conversations on this device.','<button class="btn" onclick="openChat()">＋ New chat</button>')}<div class="stories"><div class="story add" onclick="setPage('Status');openStatus()"><div class="story-ring"><div class="avatar">＋</div></div>My status</div>${people.slice(0,5).map(p=>`<div class="story"><div class="story-ring"><div class="avatar">${K_esc(p.i)}</div></div>${K_esc(p.n.split(' ')[0])}</div>`).join('')}</div><div class="card">${rows.map(c=>`<div class="chatrow" onclick="openConversation('${c.id}')">${avatar(K_esc(c.initials))}<div class="chatbody"><b>${K_esc(c.name)}</b><p>${K_esc(c.messages.at(-1)?.text||'Start a conversation')}</p></div><div class="chatmeta">${K_esc(c.messages.at(-1)?.time||'New')}</div></div>`).join('')||'<p class="muted">No matching chats. Start a new chat to add a contact.</p>'}</div>`}
function openChat(){K_modal('Start a new chat',`<label>Contact name</label><input id="kContact" class="field" maxlength="50" placeholder="Enter a name"><label>First message (optional)</label><textarea id="kFirst" class="field" rows="3" maxlength="1000" placeholder="Write your first message..."></textarea>`,'Create chat','K_createChat()')}
function K_createChat(){let name=$('#kContact').value.trim();if(!name){toast('Enter a contact name');return}let c={id:K_id(),name,initials:name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(),messages:[]};let msg=$('#kFirst').value.trim();if(msg)c.messages.push({from:'me',text:msg,time:K_time()});K_data.chats.unshift(c);K_save();closeModal();render();openConversation(c.id);toast('Chat created on this device')}
function openConversation(id){let c=K_chat(id);if(!c)return;K_openChatId=id;let messages=c.messages.map(m=>`<div style="display:flex;justify-content:${m.from==='me'?'flex-end':'flex-start'};margin:9px 0"><div style="max-width:85%;background:${m.from==='me'?'#203b2a':'#24302a'};padding:11px 13px;border-radius:13px"><div>${K_esc(m.text)}</div><small class="muted">${K_esc(m.time)}</small></div></div>`).join('');$('#modalbox').innerHTML=`<h2>${K_esc(c.name)}</h2><p class="muted small">Local conversation preview</p><div id="kThread" class="card" style="max-height:48vh;overflow:auto">${messages||'<p class="muted small">No messages yet. Say hello.</p>'}</div><label>Message</label><textarea id="kReply" class="field" rows="2" maxlength="2000" placeholder="Type a message..."></textarea><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn" onclick="K_sendReply()">Send</button></div>`;$('#modal').classList.add('show');setTimeout(()=>$('#kReply')?.focus(),50)}
function K_sendReply(){let c=K_chat(K_openChatId),v=$('#kReply')?.value.trim();if(!c||!v){toast('Type a message first');return}c.messages.push({from:'me',text:v,time:K_time()});K_save();openConversation(c.id);render();toast('Message saved on this device')}
function calls(){return `${head('Calls','Call interface preview and local call history.','<button class="btn" onclick="K_newCall()">＋ New call</button>')}<div class="grid two"><div class="card"><span class="tag">QUICK CONNECT</span><h3>Make a call</h3><p class="muted small">Choose a contact to create a simulated call session. Live audio/video needs a calling service.</p><div class="quick"><button class="btn" onclick="K_newCall('Voice')">☎ Voice call</button><button class="btn secondary" onclick="K_newCall('Video')">▣ Video call</button></div></div><div class="card"><h3>Call links</h3><p class="muted small">Create a local demo invite link. It does not connect callers.</p><button class="btn ghost" onclick="K_callLink()">＋ Create call link</button></div></div><h3 style="margin:25px 0 12px">Recent calls</h3><div class="call-list">${K_data.calls.map(c=>`<div class="person">${avatar(K_esc(c.initials))}<div class="person-info"><b>${K_esc(c.name)}</b><small>${K_esc(c.kind)} call · ${K_esc(c.time)} · ${K_esc(c.state)}</small></div><button class="iconbtn" onclick="K_newCall('${K_esc(c.kind)}','${K_esc(c.name)}')">↻</button></div>`).join('')||'<div class="card muted small">No calls yet. Start a demo call above.</div>'}</div>`}
function K_newCall(kind='Voice',preset=''){let opts=K_data.chats.map(c=>`<option>${K_esc(c.name)}</option>`).join('');K_modal(kind+' call',`<label>Contact</label><select id="kCallPerson" class="field">${opts||'<option>Demo contact</option>'}</select><p class="muted small">This records a simulated call only. Microphone, camera and network calling are not connected.</p>`,'Start preview','K_startCall(\''+kind+'\')');if(preset&&$('#kCallPerson'))$('#kCallPerson').value=preset}
function K_startCall(kind){let name=$('#kCallPerson').value||'Demo contact';K_data.calls.unshift({name,initials:name.split(/\s+/).map(x=>x[0]).join('').toUpperCase(),kind,time:K_time(),state:'Preview ended'});K_save();closeModal();render();toast(kind+' call preview recorded — no call was placed')}
function K_callLink(){let link=location.href.split('#')[0]+'#konnekt-demo-call-'+K_id();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('Demo invite link copied')).catch(()=>toast(link));else toast(link)}
function status(){return `${head('Status','Post text updates or choose media for a local preview.','<button class="btn" onclick="openStatus()">＋ Add status</button>')}<div class="card"><div class="person">${avatar('YO')}<div class="person-info"><b>My status</b><small>${K_data.statuses.length} update(s) saved on this device</small></div><button class="btn secondary" onclick="openStatus()">Add</button></div></div><h3 style="margin:25px 0 12px">My recent updates</h3><div class="status-list">${K_data.statuses.map((s,i)=>`<div class="person"><div class="person-info"><b>${K_esc(s.text)}</b><small>${K_esc(s.time)} · local preview · expires after 24 hours in this demo</small></div><button class="iconbtn" onclick="K_deleteStatus('${s.id}')">×</button></div>`).join('')||'<div class="card muted small">Your updates will appear here.</div>'}</div><h3 style="margin:25px 0 12px">Sample contacts</h3><div class="status-list">${people.slice(0,5).map(p=>`<div class="person">${avatar(p.i)}<div class="person-info"><b>${K_esc(p.n)}</b><small>Sample contact · example update</small></div></div>`).join('')}</div>`}
function openStatus(){K_modal('Create a status',`<label>What's on your mind?</label><textarea id="kStatusText" class="field" rows="4" maxlength="500" placeholder="Share a moment..."></textarea><label>Photo or video (optional)</label><input id="kStatusFile" class="field" type="file" accept="image/*,video/*"><p class="muted small">Text is saved locally. The selected file name is recorded; the media itself is not stored or uploaded.</p>`,'Post status','K_saveStatus()')}
function K_saveStatus(){let t=$('#kStatusText').value.trim(),f=$('#kStatusFile').files[0];if(!t&&!f){toast('Add text or choose a media file');return}K_data.statuses.unshift({id:K_id(),text:t||f.name,time:K_time(),mediaName:f?.name||''});K_save();closeModal();render();toast('Status saved on this device')}
function K_deleteStatus(id){K_data.statuses=K_data.statuses.filter(s=>s.id!==id);K_save();render();toast('Status deleted')}
function reels(){let r=K_data.reels[0];return `${head('Reels','Explore sample videos and manage your local Reel drafts.','<button class="btn" onclick="openCreateReel()">＋ Create Reel</button>')}<div class="reel-layout"><div><div class="reel"><div class="reel-art"><div class="play">${r?'🎬':'▶'}</div><h2>${r?K_esc(r.caption||'Your new Reel'):'Welcome to KONNEKT'}</h2><p>${r?'Your latest local Reel draft':'Discover your next favourite moment.'}</p><span class="tag">${r?'YOUR LOCAL DRAFT':'FEATURED PREVIEW'}</span></div><div class="reel-bottom"><b>@konnekt.community</b><p>${r?K_esc(r.caption):'Every connection starts with a moment. 💚 #KONNEKT #ForYou'}</p><small>${r?K_esc(r.fileName):'♫ Original audio · KONNEKT'}</small></div><div class="reel-actions"><button onclick="K_likeReel()">${K_data.liked.includes(r?.id||'featured')?'♥':'♡'}<span>${K_data.liked.includes(r?.id||'featured')?'Liked':'Like'}</span></button><button onclick="K_commentReel()">▢<span>Comment</span></button><button onclick="K_shareReel()">↗<span>Share</span></button><button onclick="K_saveReel()">▣<span>Save</span></button><button onclick="toast('Use Create Reel to add a local draft')">⋯<span>More</span></button></div></div><div class="video-tools"><button class="btn secondary" onclick="K_setFeed('For You')">For You</button><button class="btn ghost" onclick="K_setFeed('Following')">Following</button><button class="btn ghost" onclick="K_setFeed('Friends')">Friends</button></div><p class="muted small">Feed: ${K_esc(K_data.feed)} · Video playback, public publishing and music licensing are not connected yet.</p></div><aside class="reel-side"><div class="card"><span class="tag">CREATOR TOOLKIT</span><h3>Create a Reel</h3><p class="muted small">Choose a video, add a caption and save a draft locally.</p><button class="btn" style="width:100%" onclick="openCreateReel()">Create a Reel</button></div><div class="card"><b>Your drafts</b>${K_data.reels.map(x=>`<p class="small">🎬 ${K_esc(x.caption||x.fileName)} <button class="iconbtn" onclick="K_deleteReel('${x.id}')">×</button></p>`).join('')||'<p class="muted small">No drafts yet.</p>'}</div></aside></div>`}
function openCreateReel(){K_modal('Create a Reel',`<label>Choose a video</label><input id="kReelFile" class="field" type="file" accept="video/*"><label>Caption</label><textarea id="kReelCaption" class="field" rows="3" maxlength="500" placeholder="Write a caption..."></textarea><label>Hashtags</label><input id="kReelTags" class="field" placeholder="#KONNEKT #ForYou"><p class="muted small">This saves a draft record only. Video editing, sound library and publishing are not available yet.</p>`,'Save draft','K_saveReelDraft()')}
function K_saveReelDraft(){let f=$('#kReelFile').files[0],caption=$('#kReelCaption').value.trim(),tags=$('#kReelTags').value.trim();if(!f&&!caption){toast('Choose a video or enter a caption');return}K_data.reels.unshift({id:K_id(),fileName:f?.name||'Text-only draft',caption,tags,time:K_time()});K_save();closeModal();render();toast('Reel draft saved on this device')}
function K_deleteReel(id){K_data.reels=K_data.reels.filter(r=>r.id!==id);K_save();render();toast('Draft deleted')}
function K_likeReel(){let id=K_data.reels[0]?.id||'featured';K_data.liked=K_data.liked.includes(id)?K_data.liked.filter(x=>x!==id):[...K_data.liked,id];K_save();render();toast(K_data.liked.includes(id)?'Reel liked':'Like removed')}
function K_commentReel(){K_modal('Reel comments',`<p class="muted small">Comments are local to this preview.</p><label>Add a comment</label><textarea id="kComment" class="field" rows="3" placeholder="Write a comment..."></textarea>`,'Post comment','K_postComment()')}
function K_postComment(){let v=$('#kComment').value.trim();if(!v){toast('Write a comment first');return}toast('Comment saved locally');closeModal()}
function K_shareReel(){let text='Check out this KONNEKT Reel: '+location.href;if(navigator.share)navigator.share({title:'KONNEKT Reel',text}).catch(()=>{});else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Share text copied')).catch(()=>toast(text));else toast(text)}
function K_saveReel(){let id=K_data.reels[0]?.id||'featured';if(!K_data.saved.includes(id))K_data.saved.push(id);else K_data.saved=K_data.saved.filter(x=>x!==id);K_save();toast(K_data.saved.includes(id)?'Reel saved':'Removed from saved Reels')}
function K_setFeed(feed){K_data.feed=feed;K_save();render();toast(feed+' feed selected')}
function profile(){let p=K_data.profile;return `${head('Profile','Your identity and your corner of KONNEKT.','<button class="btn" onclick="openProfile()">✎ Edit profile</button>')}<div class="card" style="padding:0 0 18px;overflow:hidden"><div class="profile-cover"></div><div class="profile-head">${avatar('YO')}<div style="padding-bottom:7px"><h2 style="margin:0;font-size:20px">${K_esc(p.name)}</h2><span class="muted small">${K_esc(p.username)}</span></div></div><p class="muted small" style="margin:0 20px">${K_esc(p.bio)}</p><div class="stats"><div><strong>${K_data.reels.length}</strong><span>Reel drafts</span></div><div><strong>0</strong><span>Followers</span></div><div><strong>${K_data.following.length}</strong><span>Following</span></div></div><div class="divider" style="margin:0 20px 15px"></div><div style="padding:0 20px"><b>About</b><p class="muted small">${K_esc(p.bio)}</p><div class="quick"><button class="btn secondary" onclick="openProfile()">Edit profile</button><button class="btn ghost" onclick="K_settings()">⚙ Settings</button><button class="btn ghost" onclick="K_privacy()">🔒 Privacy</button></div></div></div><h3 style="margin:22px 0 10px">Your Reel drafts</h3><div class="card muted small">${K_data.reels.map(r=>`<p>🎬 ${K_esc(r.caption||r.fileName)}</p>`).join('')||'Your drafts will appear here.'}</div>`}
function openProfile(){let p=K_data.profile;K_modal('Edit profile',`<label>Display name</label><input id="kName" class="field" maxlength="50" value="${K_esc(p.name)}"><label>Username</label><input id="kUsername" class="field" maxlength="30" value="${K_esc(p.username)}"><label>Bio</label><textarea id="kBio" class="field" rows="3" maxlength="160">${K_esc(p.bio)}</textarea>`,'Save profile','K_saveProfile()')}
function K_saveProfile(){let n=$('#kName').value.trim(),u=$('#kUsername').value.trim(),b=$('#kBio').value.trim();if(!n||!u){toast('Name and username are required');return}K_data.profile={name:n,username:u.startsWith('@')?u:'@'+u.replace(/^@/,'') ,bio:b};K_save();closeModal();render();toast('Profile updated on this device')}
function K_settings(){K_modal('Settings',`<p class="small">KONNEKT preview settings</p><p class="muted small">Your demo data is stored in this browser on this device.</p><button class="btn ghost" onclick="K_exportData()">Export my preview data</button><button class="btn ghost" style="margin-left:6px" onclick="K_clearData()">Reset preview data</button>`,'Close')}
function K_privacy(){K_modal('Privacy & data',`<p class="small">This preview has no online account or server.</p><p class="muted small">Messages and profile details are saved in this browser's local storage. Do not use real private information in this demonstration. Clearing browser site data may erase it.</p>`,'I understand')}
function K_exportData(){let blob=new Blob([JSON.stringify(K_data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='konnekt-preview-data.json';a.click();URL.revokeObjectURL(url);toast('Preview data export started')}
function K_clearData(){if(!confirm('Delete all KONNEKT preview data stored on this device?'))return;localStorage.removeItem(K_STORE);K_data=JSON.parse(JSON.stringify(K_DEFAULT));closeModal();render();toast('Preview data reset')}
function discover(){let suggestions=['Naledi Creates','Sihle M.','The Vibe Crew','Lwazi D.'];return `${head('Discover','Search sample creators and explore categories.','<button class="btn" onclick="K_discoverSearch()">Search</button>')}<div class="card" style="margin-bottom:16px"><span class="tag">SEARCH KONNEKT</span><input id="kDiscoverQuery" class="field" style="margin-top:10px" placeholder="Search creators, topics, communities..." oninput="K_discoverSearch()"><div id="kDiscoverResults" class="small muted" style="margin-top:10px">Try searching for a creator or topic.</div></div><div class="grid discover-grid">${[['🔥','Trending Reels','See popular short videos.'],['🎨','Creators','Meet fresh voices and talent.'],['🌍','Communities','Find people with shared interests.'],['🎧','Sounds','Explore audio ideas.'],['✨','For You','Discover something new.'],['📍','Local picks','Explore local interests.']].map((x,i)=>`<div class="discover-card" onclick="K_explore('${x[1]}')"><span class="emoji">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div><h3 style="margin:25px 0 12px">People you may know</h3><div class="grid two">${suggestions.map((n,i)=>`<div class="person">${avatar(['NC','SM','VC','LD'][i])}<div class="person-info"><b>${n}</b><small>Suggested sample profile</small></div><button class="btn secondary" onclick="K_follow('${n.replace(/'/g,'')}')">${K_data.following.includes(n)?'Following':'Follow'}</button></div>`).join('')}</div>`}
function K_discoverSearch(){let q=$('#kDiscoverQuery')?.value.trim().toLowerCase()||'',names=['Naledi Creates','Sihle M.','The Vibe Crew','Lwazi D.','#GoodVibes','#DanceChallenge','Photography','Music'];let found=names.filter(n=>n.toLowerCase().includes(q));$('#kDiscoverResults').textContent=q?(found.length?found.join(' · '):'No sample results found.'):'Try searching for a creator or topic.'}
function K_explore(topic){if(topic==='Trending Reels')setPage('Reels');else toast('Exploring '+topic+' — sample category')}
function K_follow(name){if(K_data.following.includes(name))K_data.following=K_data.following.filter(n=>n!==name);else K_data.following.push(name);K_save();render();toast(K_data.following.includes(name)?'Following '+name:'Unfollowed '+name)}

// Re-render the initial screen using the upgraded local-first interactions.
render();
</script>

<script>
let konnektInstallPrompt = null;
const installButton = document.getElementById('installApp');
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  konnektInstallPrompt = event;
  if (installButton) installButton.title = 'Install KONNEKT';
});
if (installButton) installButton.addEventListener('click', async () => {
  if (konnektInstallPrompt) {
    konnektInstallPrompt.prompt();
    await konnektInstallPrompt.userChoice;
    konnektInstallPrompt = null;
  } else {
    alert('To install KONNEKT: open this site in Chrome, then use the browser menu ⋮ and choose “Install app” or “Add to Home screen”.');
  }
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script>

<script>
/* KONNEKT front-end completion layer — local device preview only. */
const K_MEDIA_DB='konnekt-media-v1';
let K_mediaDbPromise=null, K_mediaUrls={};
function K_openMediaDB(){if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB unavailable'));if(!K_mediaDbPromise)K_mediaDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(K_MEDIA_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return K_mediaDbPromise}
async function K_storeMedia(id,file){const db=await K_openMediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function K_getMedia(id){if(!id)return null;try{const db=await K_openMediaDB();return await new Promise((resolve,reject)=>{const req=db.transaction('files').objectStore('files').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}catch(e){return null}}
async function K_deleteMedia(id){if(!id)return;try{const db=await K_openMediaDB();db.transaction('files','readwrite').objectStore('files').delete(id)}catch(e){}}
async function K_mediaURL(id){if(!id)return '';if(K_mediaUrls[id])return K_mediaUrls[id];const blob=await K_getMedia(id);if(!blob)return '';K_mediaUrls[id]=URL.createObjectURL(blob);return K_mediaUrls[id]}
function K_expireStatuses(){const now=Date.now();const keep=[];for(const s of K_data.statuses){if(!s.createdAt)s.createdAt=now;if(now-s.createdAt<86400000)keep.push(s);else if(s.mediaId)K_deleteMedia(s.mediaId)}if(keep.length!==K_data.statuses.length){K_data.statuses=keep;K_save()}}
function K_renderStatusMedia(){document.querySelectorAll('[data-status-media]').forEach(async el=>{const url=await K_mediaURL(el.dataset.statusMedia);if(!url)return;const blob=await K_getMedia(el.dataset.statusMedia);if(blob?.type?.startsWith('video/'))el.innerHTML=`<video controls playsinline style="max-width:100%;max-height:220px;border-radius:12px" src="${url}"></video>`;else el.innerHTML=`<img alt="Status media" style="max-width:100%;max-height:220px;object-fit:contain;border-radius:12px" src="${url}">`})}
function K_renderReelMedia(){const el=document.querySelector('[data-reel-media]');if(!el)return;const r=K_data.reels[0];if(!r?.mediaId)return;K_mediaURL(r.mediaId).then(url=>{if(!url)return;K_getMedia(r.mediaId).then(blob=>{el.innerHTML=blob?.type?.startsWith('video/')?`<video controls playsinline style="width:100%;height:100%;object-fit:cover" src="${url}"></video>`:`<img alt="Reel draft" style="width:100%;height:100%;object-fit:cover" src="${url}">`})})}
const K_renderOriginal=render;
render=function(){K_expireStatuses();K_renderOriginal();K_renderStatusMedia();K_renderReelMedia()};
function status(){K_expireStatuses();return `${head('Status','Your updates automatically expire 24 hours after posting.','<button class="btn" onclick="openStatus()">＋ Add status</button>')}<div class="card"><div class="person">${avatar('YO')}<div class="person-info"><b>My status</b><small>${K_data.statuses.length} active update(s) · expires after 24 hours</small></div><button class="btn secondary" onclick="openStatus()">Add</button></div></div><h3 style="margin:25px 0 12px">My recent updates</h3><div class="status-list">${K_data.statuses.map(s=>`<div class="person"><div class="person-info"><b>${K_esc(s.text)}</b><small>${K_esc(s.time)} · expires ${new Date((s.createdAt||Date.now())+86400000).toLocaleString()}</small>${s.mediaId?`<div data-status-media="${K_esc(s.mediaId)}" style="margin-top:8px">Loading media…</div>`:''}</div><button class="iconbtn" onclick="K_deleteStatus('${s.id}')">×</button></div>`).join('')||'<div class="card muted small">Your updates will appear here.</div>'}</div><h3 style="margin:25px 0 12px">Sample contacts</h3><div class="status-list">${people.slice(0,5).map(p=>`<div class="person">${avatar(p.i)}<div class="person-info"><b>${K_esc(p.n)}</b><small>Sample contact · example update</small></div></div>`).join('')}</div>`}
function openStatus(){K_modal('Create a status',`<label>What's on your mind?</label><textarea id="kStatusText" class="field" rows="4" maxlength="500" placeholder="Share a moment…"></textarea><label>Photo or video</label><input id="kStatusFile" class="field" type="file" accept="image/*,video/*"><p class="muted small">Media is stored privately in this browser on this device. Status disappears automatically after 24 hours.</p>`,'Post status','K_saveStatus()')}
async function K_saveStatus(){const t=$('#kStatusText').value.trim(),f=$('#kStatusFile').files[0];if(!t&&!f){toast('Add text or choose a media file');return}const id=K_id();try{if(f)await K_storeMedia(id,f)}catch(e){toast('Could not save media on this device');return}K_data.statuses.unshift({id,text:t||f.name,time:K_time(),createdAt:Date.now(),mediaName:f?.name||'',mediaId:f?id:null});K_save();closeModal();render();toast('Status posted on this device')}
async function K_deleteStatus(id){const s=K_data.statuses.find(x=>x.id===id);if(s?.mediaId)await K_deleteMedia(s.mediaId);K_data.statuses=K_data.statuses.filter(s=>s.id!==id);K_save();render();toast('Status deleted')}
function K_commentReel(){const r=K_data.reels[0],comments=r?.comments||[];K_modal('Reel comments',`${comments.map(c=>`<div class="person"><div class="person-info"><b>${K_esc(c.author||'You')}</b><small>${K_esc(c.time)}</small><p>${K_esc(c.text)}</p></div></div>`).join('')||'<p class="muted small">No comments yet. Start the conversation.</p>'}<label>Add a comment</label><textarea id="kComment" class="field" rows="3" maxlength="500" placeholder="Write a comment…"></textarea>`,'Post comment','K_postComment()')}
function K_postComment(){const v=$('#kComment').value.trim();if(!v){toast('Write a comment first');return}let r=K_data.reels[0];if(!r){r={id:'featured',caption:'Featured KONNEKT Reel',time:K_time(),comments:[]};K_data.reels.unshift(r)}r.comments=r.comments||[];r.comments.push({id:K_id(),author:K_data.profile.name||'You',text:v,time:K_time(),createdAt:Date.now()});K_save();closeModal();toast('Comment saved on this device')}
async function K_saveReelDraft(){const f=$('#kReelFile').files[0],caption=$('#kReelCaption').value.trim(),tags=$('#kReelTags').value.trim();if(!f&&!caption){toast('Choose a video or enter a caption');return}const id=K_id();try{if(f)await K_storeMedia(id,f)}catch(e){toast('Could not save video on this device');return}K_data.reels.unshift({id,fileName:f?.name||'Text-only draft',caption,tags,time:K_time(),mediaId:f?id:null,comments:[]});K_save();closeModal();render();toast('Reel draft saved with media on this device')}
async function K_deleteReel(id){const r=K_data.reels.find(x=>x.id===id);if(r?.mediaId)await K_deleteMedia(r.mediaId);K_data.reels=K_data.reels.filter(r=>r.id!==id);K_save();render();toast('Draft deleted')}
function reels(){const r=K_data.reels[0],id=r?.id||'featured',liked=K_data.liked.includes(id),saved=K_data.saved.includes(id);return `${head('Reels','Discover short videos and create local drafts.','<button class="btn" onclick="openCreateReel()">＋ Create Reel</button>')}<div class="reel-layout"><div><div class="reel"><div data-reel-media="1" style="position:absolute;inset:0;z-index:0;display:grid;place-items:center;overflow:hidden">${r?.mediaId?'Loading your video…':''}</div><div class="reel-art" style="z-index:1;pointer-events:none"><div class="play">${r?'🎬':'▶'}</div><h2>${r?K_esc(r.caption||'Your new Reel'):'Welcome to KONNEKT'}</h2><p>${r?'Your latest local Reel draft':'Discover your next favourite moment.'}</p><span class="tag">${r?'YOUR LOCAL DRAFT':'FEATURED PREVIEW'}</span></div><div class="reel-bottom"><b>${K_esc(K_data.profile.username)}</b><p>${r?K_esc(r.caption):'Every connection starts with a moment. #KONNEKT'}</p><small>${r?K_esc(r.fileName||r.tags):'♫ Original audio · KONNEKT'}</small></div><div class="reel-actions"><button onclick="K_likeReel()">${liked?'♥':'♡'}<span>${liked?'Liked':'Like'}</span></button><button onclick="K_commentReel()">▢<span>${r?.comments?.length||0} Comments</span></button><button onclick="K_shareReel()">↗<span>Share</span></button><button onclick="K_saveReel()">▣<span>${saved?'Saved':'Save'}</span></button><button onclick="K_reelMore()">⋯<span>More</span></button></div></div><div class="video-tools"><button class="btn secondary" onclick="K_setFeed('For You')">For You</button><button class="btn ghost" onclick="K_setFeed('Following')">Following</button><button class="btn ghost" onclick="K_setFeed('Friends')">Friends</button></div><p class="muted small">Feed: ${K_esc(K_data.feed)} · Drafts and media are stored on this device; publishing is not connected.</p></div><aside class="reel-side"><div class="card"><span class="tag">CREATOR TOOLKIT</span><h3>Create a Reel</h3><p class="muted small">Choose a video, add a caption and save it as a local draft.</p><button class="btn" style="width:100%" onclick="openCreateReel()">Create a Reel</button></div><div class="card"><b>Your drafts</b>${K_data.reels.map(x=>`<p class="small">🎬 ${K_esc(x.caption||x.fileName)} <button class="iconbtn" onclick="K_deleteReel('${x.id}')">×</button></p>`).join('')||'<p class="muted small">No drafts yet.</p>'}</div></aside></div>`}
function openCreateReel(){K_modal('Create a Reel',`<label>Choose a video</label><input id="kReelFile" class="field" type="file" accept="video/*"><label>Caption</label><textarea id="kReelCaption" class="field" rows="3" maxlength="500" placeholder="Write a caption…"></textarea><label>Hashtags</label><input id="kReelTags" class="field" placeholder="#KONNEKT #ForYou"><p class="muted small">Your selected video and draft will be stored locally in this browser. Public publishing and music licensing are not connected.</p>`,'Save draft','K_saveReelDraft()')}
function K_reelMore(){const r=K_data.reels[0];if(!r){toast('Create a Reel draft to see more actions');return}K_modal('Reel options',`<p class="small">${K_esc(r.caption||r.fileName)}</p><p class="muted small">You can save, share, comment on or delete this local draft.</p>`,'Delete draft',`K_deleteReel('${r.id}')`)}
function K_explore(topic){const catalog={'Trending Reels':['Dance challenge','Local comedy','Food and lifestyle'],'Creators':['Naledi Creates','Sihle M.','Lwazi D.'],'Communities':['Music lovers','Student life','Small businesses'],'Sounds':['Original audio','Afrobeats ideas','Trending sounds'],'For You':['Recommended creators','Popular topics','New communities'],'Local picks':['Newcastle creators','KwaZulu-Natal stories','Local businesses']};const items=catalog[topic]||['Explore '+topic];K_modal(topic,`<p class="muted small">Sample discovery collection for the preview.</p><div class="grid">${items.map(x=>`<div class="person"><div class="person-info"><b>${K_esc(x)}</b><small>Explore this sample topic</small></div><button class="btn secondary" onclick="K_exploreItem('${K_esc(x)}')">Open</button></div>`).join('')}</div>`,'Done')}
function K_exploreItem(item){closeModal();if(/reel|dance|comedy/i.test(item))setPage('Reels');else{K_modal(item,`<p class="muted small">This is a sample discovery page. Real public creators and communities will appear after backend integration.</p>`,'Close')}}
function calls(){return `${head('Calls','Call-flow preview and local call history.','<button class="btn" onclick="K_newCall()">＋ New call</button>')}<div class="grid two"><div class="card"><span class="tag">QUICK CONNECT</span><h3>Make a call</h3><p class="muted small">Try the voice or video call interface. These are simulated sessions, not internet calls.</p><div class="quick"><button class="btn" onclick="K_newCall('Voice')">☎ Voice call</button><button class="btn secondary" onclick="K_newCall('Video')">▣ Video call</button></div></div><div class="card"><h3>Call links</h3><p class="muted small">Create a shareable demo link identifier. It will not connect callers.</p><button class="btn ghost" onclick="K_callLink()">＋ Create call link</button></div></div><h3 style="margin:25px 0 12px">Recent calls</h3><div class="call-list">${K_data.calls.map((c,i)=>`<div class="person">${avatar(K_esc(c.initials))}<div class="person-info"><b>${K_esc(c.name)}</b><small>${K_esc(c.kind)} call · ${K_esc(c.time)} · ${K_esc(c.state)}</small></div><button class="iconbtn" onclick="K_newCall('${K_esc(c.kind)}','${K_esc(c.name)}')">↻</button><button class="iconbtn" onclick="K_deleteCall(${i})">×</button></div>`).join('')||'<div class="card muted small">No calls yet. Start a preview call above.</div>'}</div>`}
function K_newCall(kind='Voice',preset=''){const opts=K_data.chats.map(c=>`<option value="${K_esc(c.name)}">${K_esc(c.name)}</option>`).join('');K_modal(kind+' call',`<label>Contact</label><select id="kCallPerson" class="field">${opts||'<option>Demo contact</option>'}</select><p class="muted small">This opens a simulated call screen. Real microphone, camera, network signalling and remote participants require a calling provider.</p>`,'Start call preview',`K_startCall('${kind}')`);if(preset&&$('#kCallPerson'))$('#kCallPerson').value=preset}
function K_startCall(kind){const name=$('#kCallPerson')?.value||'Demo contact';const call={id:K_id(),name,initials:name.split(/\s+/).map(x=>x[0]).join('').toUpperCase(),kind,time:K_time(),state:'In progress',startedAt:Date.now()};K_data.calls.unshift(call);K_save();K_showCallSession(call.id)}
function K_showCallSession(id){const c=K_data.calls.find(x=>x.id===id);if(!c)return;$('#modalbox').innerHTML=`<div style="text-align:center;padding:22px 5px"><div class="avatar" style="width:86px;height:86px;font-size:28px;margin:12px auto">${K_esc(c.initials)}</div><h2>${K_esc(c.name)}</h2><p class="muted">${K_esc(c.kind)} call preview</p><p id="kCallTimer" class="tag">00:00</p><p class="muted small">Simulation only — no audio or video is being transmitted.</p><div class="quick" style="justify-content:center;margin:20px 0"><button class="btn secondary" onclick="this.classList.toggle('active');this.textContent=this.classList.contains('active')?'Mic off':'Mic on'">Mic on</button>${c.kind==='Video'?'<button class="btn secondary" onclick="this.classList.toggle(\'active\');this.textContent=this.classList.contains(\'active\')?\'Camera off\':\'Camera on\'">Camera on</button>':''}<button class="btn" style="background:#d94359;color:white" onclick="K_endCall('${id}')">End call</button></div></div>`;$('#modal').classList.add('show');window.clearInterval(window.K_callTicker);window.K_callTicker=setInterval(()=>{const el=$('#kCallTimer');if(!el){clearInterval(window.K_callTicker);return}const sec=Math.floor((Date.now()-c.startedAt)/1000);el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000)}
function K_endCall(id){const c=K_data.calls.find(x=>x.id===id);if(c){c.state='Ended · '+Math.max(1,Math.round((Date.now()-c.startedAt)/1000))+' sec';c.duration=Math.max(1,Math.round((Date.now()-c.startedAt)/1000));K_save()}clearInterval(window.K_callTicker);closeModal();render();toast('Call preview ended')}
function K_deleteCall(index){K_data.calls.splice(index,1);K_save();render();toast('Call history entry deleted')}
function K_callLink(){const link=location.href.split('#')[0]+'#konnekt-demo-call-'+K_id();if(navigator.share)navigator.share({title:'KONNEKT call preview',url:link}).catch(()=>{});else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('Demo call link copied')).catch(()=>toast(link));else toast(link)}
function discover(){const suggestions=['Naledi Creates','Sihle M.','The Vibe Crew','Lwazi D.'];const topics=[['🔥','Trending Reels','See popular short videos.'],['🎨','Creators','Meet fresh voices and talent.'],['🌍','Communities','Find people with shared interests.'],['🎧','Sounds','Explore audio ideas.'],['✨','For You','Discover something new.'],['📍','Local picks','Explore local interests.']];return `${head('Discover','Search sample creators, topics and communities.','<button class="btn" onclick="K_discoverSearch()">Search</button>')}<div class="card" style="margin-bottom:16px"><span class="tag">SEARCH KONNEKT</span><input id="kDiscoverQuery" class="field" style="margin-top:10px" placeholder="Search creators, topics, communities…" oninput="K_discoverSearch()"><div id="kDiscoverResults" class="small muted" style="margin-top:10px">Try a name, topic or category.</div></div><div class="grid discover-grid">${topics.map(x=>`<div class="discover-card" role="button" tabindex="0" onclick="K_explore('${x[1]}')"><span class="emoji">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div><h3 style="margin:25px 0 12px">People you may know</h3><div class="grid two">${suggestions.map((n,i)=>`<div class="person">${avatar(['NC','SM','VC','LD'][i])}<div class="person-info"><b>${n}</b><small>${K_data.following.includes(n)?'You follow this sample profile':'Suggested sample profile'}</small></div><button class="btn secondary" onclick="K_follow('${n}')">${K_data.following.includes(n)?'Following':'Follow'}</button></div>`).join('')}</div>`}
function K_discoverSearch(){const q=$('#kDiscoverQuery')?.value.trim().toLowerCase()||'',names=['Naledi Creates','Sihle M.','The Vibe Crew','Lwazi D.','#GoodVibes','#DanceChallenge','Photography','Music','Communities','Newcastle creators','Student life','Small businesses'];const found=names.filter(n=>n.toLowerCase().includes(q));const el=$('#kDiscoverResults');if(el)el.innerHTML=q?(found.length?found.map(n=>`<button class="btn ghost" style="margin:3px" onclick="K_exploreItem('${K_esc(n)}')">${K_esc(n)}</button>`).join(''):'No sample results found.'):'Try a name, topic or category.'}
function profile(){const p=K_data.profile;return `${head('Profile','Your identity and your corner of KONNEKT.','<button class="btn" onclick="openProfile()">✎ Edit profile</button>')}<div class="card" style="padding:0 0 18px;overflow:hidden"><div class="profile-cover"></div><div class="profile-head">${avatar('YO')}<div style="padding-bottom:7px"><h2 style="margin:0;font-size:20px">${K_esc(p.name)}</h2><span class="muted small">${K_esc(p.username)}</span></div></div><p class="muted small" style="margin:0 20px">${K_esc(p.bio)}</p><div class="stats"><div><strong>${K_data.reels.length}</strong><span>Reel drafts</span></div><div><strong>0</strong><span>Followers</span></div><div><strong>${K_data.following.length}</strong><span>Following</span></div></div><div class="divider" style="margin:0 20px 15px"></div><div style="padding:0 20px"><b>About</b><p class="muted small">${K_esc(p.bio)}</p><div class="quick"><button class="btn secondary" onclick="openProfile()">Edit profile</button><button class="btn ghost" onclick="K_settings()">⚙ Settings</button><button class="btn ghost" onclick="K_privacy()">🔒 Privacy</button></div></div></div><h3 style="margin:22px 0 10px">Your Reel drafts</h3><div class="card muted small">${K_data.reels.map(r=>`<p>🎬 ${K_esc(r.caption||r.fileName)}</p>`).join('')||'Your drafts will appear here.'}</div>`}
function K_profileAvatar(){return K_data.profile.avatarMediaId?`<div class="avatar" data-profile-avatar="${K_esc(K_data.profile.avatarMediaId)}">${K_esc((K_data.profile.name||'YO').slice(0,2).toUpperCase())}</div>`:avatar((K_data.profile.name||'YO').slice(0,2).toUpperCase())}
function K_renderProfileAvatar(){document.querySelectorAll('[data-profile-avatar]').forEach(async el=>{const url=await K_mediaURL(el.dataset.profileAvatar);if(url)el.innerHTML=`<img alt="Profile photo" src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`})}
const K_renderWithProfile=render;
render=function(){K_renderWithProfile();K_renderProfileAvatar()};
function profile(){const p=K_data.profile;return `${head('Profile','Your identity and your corner of KONNEKT.','<button class="btn" onclick="openProfile()">✎ Edit profile</button>')}<div class="card" style="padding:0 0 18px;overflow:hidden"><div class="profile-cover"></div><div class="profile-head">${K_profileAvatar()}<div style="padding-bottom:7px"><h2 style="margin:0;font-size:20px">${K_esc(p.name)}</h2><span class="muted small">${K_esc(p.username)}</span></div></div><p class="muted small" style="margin:0 20px">${K_esc(p.bio)}</p><div class="stats"><div><strong>${K_data.reels.length}</strong><span>Reel drafts</span></div><div><strong>0</strong><span>Followers</span></div><div><strong>${K_data.following.length}</strong><span>Following</span></div></div><div class="divider" style="margin:0 20px 15px"></div><div style="padding:0 20px"><b>About</b><p class="muted small">${K_esc(p.bio)}</p><div class="quick"><button class="btn secondary" onclick="openProfile()">Edit profile</button><button class="btn ghost" onclick="K_settings()">⚙ Settings</button><button class="btn ghost" onclick="K_privacy()">🔒 Privacy</button></div></div></div><h3 style="margin:22px 0 10px">Your Reel drafts</h3><div class="card muted small">${K_data.reels.map(r=>`<p>🎬 ${K_esc(r.caption||r.fileName)}</p>`).join('')||'Your drafts will appear here.'}</div>`}
function openProfile(){const p=K_data.profile;K_modal('Edit profile',`<label>Display name</label><input id="kName" class="field" maxlength="50" value="${K_esc(p.name)}"><label>Username</label><input id="kUsername" class="field" maxlength="30" value="${K_esc(p.username)}"><label>Bio</label><textarea id="kBio" class="field" rows="3" maxlength="160">${K_esc(p.bio)}</textarea><label>Profile photo</label><input id="kProfileFile" class="field" type="file" accept="image/*"><p class="muted small">Your profile photo is saved locally on this device.</p>`,'Save profile','K_saveProfile()')}
async function K_saveProfile(){const n=$('#kName').value.trim(),u=$('#kUsername').value.trim(),b=$('#kBio').value.trim(),f=$('#kProfileFile')?.files[0];if(!n||!u){toast('Name and username are required');return}let avatarMediaId=K_data.profile.avatarMediaId||null;if(f){avatarMediaId=K_id();try{await K_storeMedia(avatarMediaId,f)}catch(e){toast('Could not save profile photo');return}}K_data.profile={name:n,username:u.startsWith('@')?u:'@'+u.replace(/^@/,''),bio:b,avatarMediaId};K_save();closeModal();render();toast('Profile updated on this device')}

const K_deleteReelBase=K_deleteReel;async function K_deleteReel(id){await K_deleteReelBase(id);if($('#modal')?.classList.contains('show'))closeModal();render()}

render();
</script>

<style>
/* Account + staging preview additions; preserve KONNEKT purple/gold identity. */
.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.auth-panel{border:1px solid #593278;border-radius:14px;padding:14px;background:linear-gradient(145deg,#1b102b,#100a19)}.auth-panel h3{margin:0 0 7px;color:#f5d9ff}.auth-status{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #593278;border-radius:11px;background:#160d25;font-size:12px}.auth-dot{width:9px;height:9px;border-radius:50%;background:#ffc107;display:inline-block}.auth-dot.good{background:#32d583}.auth-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.auth-tabs button{padding:8px 11px;border:1px solid #593278;border-radius:9px;background:#140d20;color:#e9d8f8;font-size:12px}.auth-tabs button.active{background:#542080;color:#fff;border-color:#bd72ec}.auth-help{font-size:11px;line-height:1.55;color:#b6a6c7}.auth-kv{font-size:11px;color:#b6a6c7;overflow-wrap:anywhere}.auth-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.auth-actions .btn{font-size:12px}.auth-label{display:block;font-size:11px;color:#cdb9df;margin:10px 0 5px}.auth-modal{width:min(720px,100%)}
@media(max-width:760px){.top-right{gap:6px}.top-right .iconbtn{width:34px;height:34px}.top-right .search{width:24vw;min-width:68px}}
@media(max-width:650px){.auth-grid{grid-template-columns:1fr}.auth-modal{max-height:90vh}}
</style>
<script>
/* KONNEKT account + backend preview layer. Demo auth is local-only; Supabase is optional staging. */
const K_AUTH_STORE='konnekt-auth-preview-v1',K_BACKEND_STORE='konnekt-staging-config-v1';
let K_authState=(()=>{try{const v=JSON.parse(localStorage.getItem(K_AUTH_STORE)||'{"user":null,"accounts":[]}');return {...v,accounts:Array.isArray(v.accounts)?v.accounts:[],user:v.user||null}}catch(e){return {user:null,accounts:[]}}})();
let K_backendConfig=(()=>{try{return JSON.parse(localStorage.getItem(K_BACKEND_STORE)||'{"url":"","anonKey":""}')}catch(e){return {url:'',anonKey:''}}})();
let K_supabaseClient=null,K_supabaseLoad=null,K_authView='overview';
function K_authSave(){localStorage.setItem(K_AUTH_STORE,JSON.stringify(K_authState))}
function K_backendSave(){localStorage.setItem(K_BACKEND_STORE,JSON.stringify(K_backendConfig))}
function K_authEsc(v){return K_esc(v)}
function K_accountPanel(){
 const u=K_authState.user,configured=!!(K_backendConfig.url&&K_backendConfig.anonKey);
 if(u?.expiresAt&&Date.now()>u.expiresAt){K_authState.user=null;K_authSave()}
 const currentUser=K_authState.user;
 const demoStatus=currentUser?`Signed in locally as <b>${K_authEsc(currentUser.email)}</b>`:'No demo account is signed in';
 K_modal('KONNEKT · Account & backend',`<div class="auth-status"><span class="auth-dot ${currentUser?'good':''}"></span><span>${demoStatus}</span></div>
 <div class="auth-tabs"><button class="${K_authView==='overview'?'active':''}" onclick="K_authView='overview';K_accountPanel()">Overview</button><button class="${K_authView==='demo'?'active':''}" onclick="K_authView='demo';K_accountPanel()">Try authentication</button><button class="${K_authView==='staging'?'active':''}" onclick="K_authView='staging';K_accountPanel()">Connect staging</button></div>
 <div id="kAuthPanel">${K_authView==='overview'?K_authOverview():K_authView==='demo'?K_authDemo():K_authStaging()}</div>`,'Close','closeModal()');
 $('#modalbox').classList.add('auth-modal');
}
function K_authOverview(){return `<div class="auth-grid"><div class="auth-panel"><span class="tag">INTERACTIVE PREVIEW</span><h3 style="margin-top:12px">Account experience</h3><p class="auth-help">Explore registration, sign-in, email verification and password reset using demo-only accounts stored in this browser. No email is sent.</p><button class="btn" onclick="K_authView='demo';K_accountPanel()">Open authentication</button></div><div class="auth-panel"><span class="tag">OPTIONAL REAL STAGING</span><h3 style="margin-top:12px">Supabase connection</h3><p class="auth-help">Connect a separate test project to try real hosted authentication. This requires your Supabase project URL and public anon/publishable key.</p><button class="btn secondary" onclick="K_authView='staging';K_accountPanel()">Configure staging</button></div></div><div class="divider"></div><p class="auth-help"><b>Important:</b> demo authentication is not secure production authentication. The staging connector uses the public client key only. Never paste a service_role or secret key here. Do not use real customer data in this preview.</p><div class="auth-actions">${u?'<button class="btn ghost" onclick="K_demoSignOut()">Sign out demo account</button>':''}<button class="btn ghost" onclick="K_authView='staging';K_accountPanel()">Backend status & setup</button></div>`}
function K_authDemo(){return `<div class="auth-panel"><span class="tag">LOCAL DEMO · NOT A REAL ACCOUNT</span><div class="auth-tabs"><button onclick="K_demoForm('signup')">Create account</button><button onclick="K_demoForm('login')">Sign in</button><button onclick="K_demoForm('forgot')">Forgot password</button></div><div id="kDemoForm">${K_demoFormHTML('signup')}</div><p class="auth-help">Demo accounts stay on this browser only. Verification is simulated and no password or email is sent to a server.</p></div>`}
function K_demoForm(mode){const el=$('#kDemoForm');if(el)el.innerHTML=K_demoFormHTML(mode)}
function K_demoFormHTML(mode){if(mode==='signup')return `<label class="auth-label">Display name</label><input id="kDemoName" class="field" autocomplete="name" placeholder="Your name"><label class="auth-label">Email address</label><input id="kDemoEmail" class="field" type="email" autocomplete="email" placeholder="you@example.com"><label class="auth-label">Password</label><input id="kDemoPassword" class="field" type="password" autocomplete="new-password" placeholder="At least 10 characters"><label class="auth-label">Confirm password</label><input id="kDemoConfirm" class="field" type="password" placeholder="Repeat password"><div class="auth-actions"><button class="btn" onclick="K_demoSignUp()">Create demo account</button></div>`;
 if(mode==='login')return `<label class="auth-label">Email address</label><input id="kDemoEmail" class="field" type="email" autocomplete="email" placeholder="you@example.com"><label class="auth-label">Password</label><input id="kDemoPassword" class="field" type="password" autocomplete="current-password" placeholder="Your demo password"><div class="auth-actions"><button class="btn" onclick="K_demoSignIn()">Sign in</button></div>`;
 return `<label class="auth-label">Email address</label><input id="kDemoEmail" class="field" type="email" placeholder="Account email"><div class="auth-actions"><button class="btn" onclick="K_demoReset()">Simulate password reset</button></div><p class="auth-help">This local demo simulates a reset link and lets you set a new password. No email is sent.</p>`}
async function K_hashDemo(p){if(!window.crypto?.subtle||!crypto.getRandomValues)throw new Error('Secure browser cryptography is unavailable. Open KONNEKT over HTTPS or localhost.');const salt=crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},key,256);const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');return `pbkdf2$310000$${hex(salt)}$${hex(bits)}`}
async function K_verifyDemoPassword(password,stored){if(typeof stored!=='string')return false;if(stored.startsWith('pbkdf2$')){try{const [,iterations,saltHex,hashHex]=stored.split('$');const salt=new Uint8Array(saltHex.match(/.{2}/g).map(x=>parseInt(x,16)));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:Number(iterations),hash:'SHA-256'},key,256);const actual=Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('');return actual===hashHex}catch(e){return false}}const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(password));const legacy=Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('');return stored===legacy||stored==='demo-'+btoa(unescape(encodeURIComponent(password)))}
async function K_demoSignUp(){try{const name=$('#kDemoName')?.value.trim(),email=$('#kDemoEmail')?.value.trim().toLowerCase(),pw=$('#kDemoPassword')?.value,confirmPw=$('#kDemoConfirm')?.value;if(!name||!email||!pw){toast('Complete all fields');return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Enter a valid email address');return}if(pw.length<10){toast('Use at least 10 characters');return}if(pw!==confirmPw){toast('Passwords do not match');return}if(K_authState.accounts.some(a=>a.email===email)){toast('A demo account already exists for this email');return}const passwordHash=await K_hashDemo(pw);K_authState.accounts.push({id:K_id(),name,email,passwordHash,verified:false,createdAt:new Date().toISOString()});K_authState.pendingEmail=email;K_authSave();K_authView='demo';K_accountPanel();$('#kDemoForm').innerHTML=K_demoVerifyHTML(email)}catch(e){toast(e.message||'Could not create demo account')}}
function K_demoVerifyHTML(email){return `<div class="auth-status"><span class="auth-dot"></span>Demo verification required for <b>${K_authEsc(email)}</b></div><p class="auth-help">In a real app, KONNEKT would send a one-time verification link or code to this address. In this preview, use the button below to simulate successful verification.</p><div class="auth-actions"><button class="btn" onclick="K_demoVerify()">Simulate email verification</button><button class="btn ghost" onclick="K_demoForm('login')">Back to sign in</button></div>`}
function K_demoVerify(){const a=K_authState.accounts.find(x=>x.email===K_authState.pendingEmail);if(!a){toast('Demo account not found');return}a.verified=true;K_authSave();K_demoForm('login');const email=$('#kDemoEmail');if(email)email.value=a.email;toast('Demo email marked as verified')}
async function K_demoSignIn(){const email=$('#kDemoEmail')?.value.trim().toLowerCase(),pw=$('#kDemoPassword')?.value;if(!email||!pw){toast('Enter email and password');return}const a=K_authState.accounts.find(x=>x.email===email);if(!a||!await K_verifyDemoPassword(pw,a.passwordHash)){toast('Incorrect demo email or password');return}if(!a.verified){$('#kDemoForm').innerHTML=K_demoVerifyHTML(email);return}if(!a.passwordHash.startsWith('pbkdf2$'))a.passwordHash=await K_hashDemo(pw);K_authState.user={id:a.id,email:a.email,name:a.name,mode:'demo',expiresAt:Date.now()+12*60*60*1000};K_authSave();K_accountPanel();toast('Signed in to the local demo')}
function K_demoReset(){const email=$('#kDemoEmail')?.value.trim().toLowerCase();const a=K_authState.accounts.find(x=>x.email===email);if(!email){toast('Enter the account email first');return}if(!a){toast('No demo account found for that email');return}K_authState.pendingResetEmail=email;const el=$('#kDemoForm');if(el)el.innerHTML=`<div class="auth-status"><span class="auth-dot"></span>Demo password reset for <b>${K_authEsc(email)}</b></div><p class="auth-help">No email is sent. Continue to simulate opening a reset link on this device.</p><div class="auth-actions"><button class="btn" onclick="K_demoResetContinue()">Simulate reset link</button><button class="btn ghost" onclick="K_demoForm('login')">Cancel</button></div>`}
function K_demoResetContinue(){const el=$('#kDemoForm');if(el)el.innerHTML=`<label class="auth-label">New password</label><input id="kResetPassword" class="field" type="password" autocomplete="new-password" placeholder="At least 10 characters"><label class="auth-label">Confirm new password</label><input id="kResetConfirm" class="field" type="password" autocomplete="new-password" placeholder="Repeat new password"><div class="auth-actions"><button class="btn" onclick="K_demoSetPassword()">Save new password</button></div>`}
async function K_demoSetPassword(){const email=K_authState.pendingResetEmail,pw=$('#kResetPassword')?.value,confirmPw=$('#kResetConfirm')?.value;const a=K_authState.accounts.find(x=>x.email===email);if(!a){toast('Reset session expired. Start again.');return}if(!pw||pw.length<10){toast('Use at least 10 characters');return}if(pw!==confirmPw){toast('Passwords do not match');return}try{a.passwordHash=await K_hashDemo(pw);K_authState.pendingResetEmail=null;K_authState.user=null;K_authSave();K_demoForm('login');const input=$('#kDemoEmail');if(input)input.value=email;toast('Demo password updated on this device')}catch(e){toast(e.message||'Could not update password')}}
function K_demoSignOut(){K_authState.user=null;K_authSave();K_accountPanel();toast('Signed out of demo account')}
function K_authStaging(){return `<div class="auth-panel"><span class="tag">SUPABASE STAGING CONFIGURATION</span><p class="auth-help">Create a separate Supabase project for testing. Enter its Project URL and anon/public (or publishable) key below. These are client-side credentials; database access must still be restricted with Row Level Security policies.</p><label class="auth-label">Supabase Project URL</label><input id="kSbUrl" class="field" type="url" placeholder="https://your-project.supabase.co" value="${K_authEsc(K_backendConfig.url)}"><label class="auth-label">Supabase anon / publishable key</label><input id="kSbKey" class="field" type="password" autocomplete="off" placeholder="Paste public client key" value="${K_authEsc(K_backendConfig.anonKey)}"><div class="auth-actions"><button class="btn" onclick="K_saveStagingConfig()">Save staging settings</button><button class="btn secondary" onclick="K_testStaging()">Test Auth connection</button><button class="btn secondary" onclick="K_testDatabase()">Test database &amp; RLS</button><button class="btn ghost" onclick="K_clearStagingConfig()">Clear</button></div><div id="kSbResult" class="auth-help" style="margin-top:12px">${K_backendConfig.url?'Configuration saved on this device. Test the connection to verify it.':'No staging project configured yet.'}</div></div><div class="auth-panel" style="margin-top:12px"><h3>Real staging authentication</h3><p class="auth-help">Once connected, you can test real sign-up, sign-in and password reset against your own staging project. Email delivery and verification depend on your Supabase Auth settings.</p><label class="auth-label">Test email</label><input id="kSbEmail" class="field" type="email" placeholder="test@example.com"><label class="auth-label">Test password</label><input id="kSbPassword" class="field" type="password" placeholder="At least 10 characters"><div class="auth-actions"><button class="btn" onclick="K_sbSignUp()">Staging sign up</button><button class="btn secondary" onclick="K_sbSignIn()">Staging sign in</button><button class="btn ghost" onclick="K_sbReset()">Reset password</button><button class="btn ghost" onclick="K_sbResendVerification()">Resend verification</button><button class="btn ghost" onclick="K_sbSignOut()">Sign out</button></div><div id="kSbAuthResult" class="auth-help" style="margin-top:10px">No staging auth action performed.</div></div><p class="auth-help">Never enter a Supabase service_role key or database password. The public key is not a substitute for Row Level Security. This preview does not create database tables or deploy policies automatically.</p>`}
function K_saveStagingConfig(){const url=$('#kSbUrl')?.value.trim().replace(/\/$/,''),key=$('#kSbKey')?.value.trim();if(!url||!key){toast('Enter both project URL and public key');return}if(!/^https:\/\/[a-zA-Z0-9.-]+$/.test(url)){toast('Use a valid HTTPS Supabase project URL');return}if(/service_role|secret/i.test(key)){toast('Do not use a service_role or secret key here');return}K_backendConfig={url,anonKey:key};K_backendSave();K_supabaseClient=null;K_supabaseLoad=null;const el=$('#kSbResult');if(el)el.textContent='Saved locally. Select Test connection to verify the project.';toast('Staging settings saved on this device')}
function K_clearStagingConfig(){K_backendConfig={url:'',anonKey:''};K_backendSave();K_supabaseClient=null;K_supabaseLoad=null;K_accountPanel();toast('Staging settings cleared')}
async function K_loadSupabase(){if(!K_backendConfig.url||!K_backendConfig.anonKey)throw new Error('Save the project URL and public key first.');if(!window.supabase?.createClient){if(!K_supabaseLoad)K_supabaseLoad=new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=resolve;sc.onerror=()=>reject(new Error('Could not load Supabase client library. Check your internet connection.'));document.head.appendChild(sc)});await K_supabaseLoad}if(!K_supabaseClient)K_supabaseClient=window.supabase.createClient(K_backendConfig.url,K_backendConfig.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return K_supabaseClient}
async function K_testStaging(){const el=$('#kSbResult');if(el)el.textContent='Checking the Supabase Auth endpoint…';try{await K_loadSupabase();const response=await fetch(K_backendConfig.url+'/auth/v1/settings',{headers:{apikey:K_backendConfig.anonKey}});if(!response.ok)throw new Error('Auth endpoint returned HTTP '+response.status);const settings=await response.json();if(el)el.textContent='Auth endpoint reachable. Supabase Auth settings loaded. Email sign-up '+(settings.disable_signup?'disabled':'available')+'. This does not yet verify database policies.'}catch(e){if(el)el.textContent='Auth connection test failed: '+e.message}}
async function K_testDatabase(){const el=$('#kSbResult');if(el)el.textContent='Testing profiles table access and Row Level Security…';try{const sb=await K_loadSupabase();const {data:sessionData,error:sessionError}=await sb.auth.getSession();if(sessionError)throw sessionError;if(!sessionData.session)throw new Error('Sign in to a staging account first');const {data,error}=await sb.from('profiles').select('id').limit(1);if(error)throw error;if(el)el.textContent='Database query succeeded for signed-in user. Rows returned: '+data.length+'. Now test with two accounts to verify isolation; one successful query does not prove every policy is correct.'}catch(e){if(el)el.textContent='Database/RLS test failed: '+e.message+'. Confirm the SQL schema was applied and a staging user is signed in.'}}
function K_sbResult(msg){const el=$('#kSbAuthResult');if(el)el.textContent=msg}
async function K_sbSignUp(){const email=$('#kSbEmail')?.value.trim(),password=$('#kSbPassword')?.value;if(!email||!password){K_sbResult('Enter a test email and password.');return}if(password.length<8){K_sbResult('Use at least 8 characters.');return}try{const sb=await K_loadSupabase();const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;K_sbResult(data.session?'Staging account created and signed in.':'Sign-up request accepted. Check the test inbox if email confirmation is enabled.');}catch(e){K_sbResult('Sign-up failed: '+e.message)}}
async function K_sbSignIn(){const email=$('#kSbEmail')?.value.trim(),password=$('#kSbPassword')?.value;if(!email||!password){K_sbResult('Enter a test email and password.');return}try{const sb=await K_loadSupabase();const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;K_sbResult('Signed in to staging as '+data.user.email+'.');}catch(e){K_sbResult('Sign-in failed: '+e.message)}}
async function K_sbReset(){const email=$('#kSbEmail')?.value.trim();if(!email){K_sbResult('Enter the test email first.');return}try{const sb=await K_loadSupabase();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;K_sbResult('Password reset request sent if the account exists. Check Supabase email settings and the test inbox.');}catch(e){K_sbResult('Reset request failed: '+e.message)}}
async function K_sbSignOut(){try{const sb=await K_loadSupabase();const {error}=await sb.auth.signOut();if(error)throw error;K_sbResult('Signed out of the staging session.');}catch(e){K_sbResult('Sign-out failed: '+e.message)}}
const K_accountAccessButton=document.getElementById('accountAccess');if(K_accountAccessButton)K_accountAccessButton.addEventListener('click',K_accountPanel);
</script>
