<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1c3827 0,#0c120f 48%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}

.discover-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.discover-card{min-height:170px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#254b32,#15251a);border:1px solid #34563b;border-radius:16px;padding:16px;overflow:hidden;position:relative}.discover-card:nth-child(2){background:linear-gradient(145deg,#49304a,#211927);border-color:#543c55}.discover-card:nth-child(3){background:linear-gradient(145deg,#51452a,#272115);border-color:#635638}.discover-card .emoji{font-size:31px}.discover-card b{font-size:15px}.discover-card p{font-size:11px;color:#d0dbd2;margin:5px 0 0}

.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{max-height:88vh;overflow:auto;background:#142019;border:1px solid #38503d;border-radius:18px;padding:22px;width:min(440px,100%);box-shadow:0 20px 70px #0009}.modalbox h2{margin:0 0 6px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#dfffea;color:#092012;padding:11px 17px;border-radius:12px;font-size:12px;font-weight:750;display:none;z-index:30;box-shadow:0 8px 30px #0007}
.mobile-nav{display:none}
@media(max-width:760px){.app{display:block;border:0}.sidebar{display:none}.topbar{height:65px;padding:0 15px}.top-title{font-size:17px}.search{width:42vw;padding:9px}.content{padding:19px 15px 95px}.reel-layout{grid-template-columns:1fr}.reel{height:64vh;min-height:430px;max-height:650px}.reel-side{grid-template-columns:1fr 1fr}.discover-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:10;grid-template-columns:repeat(6,1fr);background:#101912f5;border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mobile-nav button{border:0;background:none;color:#82958a;font-size:9px;display:grid;justify-items:center;gap:4px;padding:4px 0}.mobile-nav .ico{font-size:19px}.mobile-nav button.active{color:var(--green)}.two{grid-template-columns:1fr}.heading h1{font-size:24px}}
@media(max-width:390px){.discover-grid{grid-template-columns:1fr 1fr}.reel-side{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.search{width:38vw}}
