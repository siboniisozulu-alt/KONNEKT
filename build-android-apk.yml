name: Build KONNEKT Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.jsx'
      - 'main.jsx'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KONNEKT
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web assets for the native app
        run: npm run build:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Install KONNEKT Android icon and splash assets
        run: |
          mkdir -p android/app/src/main/res
          cp -R android-res/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/drawable-nodpi android/app/src/main/res/values
          cp android-res/drawable/splash.png android/app/src/main/res/drawable/splash.png
          cp android-res/drawable-nodpi/splash.png android/app/src/main/res/drawable-nodpi/splash.png
          cp android-res/values/colors.xml android/app/src/main/res/values/colors.xml

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KONNEKT-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
